<style>
/* VOICE: 紙のニュースレターのように静か。装飾より文字
   IDEA: 号ごとに綴じた薄い冊子を一枚ずつめくる
   PICTURE: 見出し・説明・出典の三段だけが並ぶ紙面
   COLOUR and TYPE: 紙白／墨黒の二色、言語の色は小さな点と進捗線だけ／Inter + Noto Sans JP
   LAYOUT: 上に号と言語、細い進捗線、本文は細い罫線で区切るだけ、下に送りボタン */
:root{color-scheme:light dark;
  --bg:light-dark(#fbfaf7,#131313);--ink:light-dark(#1b1b1b,#ececea);--sub:light-dark(#555,#a9a9a5);--dim:light-dark(#8c8c88,#6f6f6c);
  --line:light-dark(#e6e4de,#262626);--hover:light-dark(#f0eee8,#1d1d1d);
  --c-js:light-dark(#a88a00,#e8c21a);--c-go:light-dark(#00809e,#2bbbe0);--c-py:light-dark(#2f66c2,#6f9ff0);--c-rs:light-dark(#c4561c,#f08048);--c-rb:light-dark(#b3262b,#ff6b6b);--acc:var(--c-js)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-lang=go]{--acc:var(--c-go)}:root[data-lang=py]{--acc:var(--c-py)}:root[data-lang=rs]{--acc:var(--c-rs)}:root[data-lang=rb]{--acc:var(--c-rb)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 Inter,"Noto Sans JP",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100dvh;display:grid;grid-template-rows:auto auto auto auto 1fr auto;max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app>header{grid-row:1}.langs{grid-row:2}.tabs{grid-row:3}.prog{grid-row:4}.deck{grid-row:5}.app>footer{grid-row:6}
.wrap{padding-inline:20px}
header{display:flex;align-items:flex-start;gap:4px;padding-block:22px 6px}
h1{margin:0;flex:1;font-weight:600;font-size:13px;line-height:1.3;color:var(--dim);letter-spacing:.01em}
h1 #num{display:block;margin-top:4px;color:var(--ink);font-size:34px;line-height:1;font-weight:700;letter-spacing:-.02em}
h1 small{display:block;margin-top:6px;font-size:13px;font-weight:400}
button,input,textarea{font:inherit;color:inherit}
.btn{height:40px;min-width:40px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--sub);cursor:pointer;display:inline-grid;place-items:center;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.btn.ic{padding:0;width:40px}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-pressed=true],details[open]>.btn{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.th-sun{display:none}:root[data-theme=dark] .th-sun{display:block}:root[data-theme=dark] .th-moon{display:none}
.langs{display:flex;gap:22px;padding-block:8px 6px;border-bottom:1px solid var(--line)}
.lang{position:relative;height:38px;padding:0;border:0;background:none;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer}
.lang i{font-style:normal}.lang span{display:none}
.lang[aria-pressed=true]{color:var(--ink)}
.lang[aria-pressed=true]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lc);margin-right:7px;vertical-align:1px}
.lang:hover{color:var(--ink)}
.tabs{display:flex;gap:16px;overflow-x:auto;padding:10px 20px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs:empty,.prog:has(.bars:empty){display:none}
.tab{flex:none;height:30px;padding:0;border:0;background:none;color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);font-weight:600}
.prog{display:flex;align-items:center;gap:12px;padding-block:8px 4px}
.bars{flex:1;display:flex;gap:3px;height:14px;align-items:center}
.bars.many{gap:1px}
.bars b{flex:1;height:2px;background:var(--line);overflow:hidden;cursor:pointer}
.bars b i{display:block;height:100%;background:var(--acc);transform-origin:left;transform:scaleX(0)}
#pos{flex:none;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:14px 20px 40px}
.page h2{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.page h2 small{font-size:13px;color:var(--dim);font-weight:500}
.page h2 span{margin-left:auto;font-size:12px;font-weight:500;color:var(--dim)}
.it{padding:18px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .th{display:block;width:100%;height:150px;object-fit:cover;border-radius:8px;margin-bottom:12px;background:var(--hover)}
@media(min-width:601px){.it.has-img{display:grid;grid-template-columns:1fr 168px;column-gap:20px}.it.has-img .th{grid-column:2;grid-row:1/span 4;margin:4px 0 0;height:112px}.it.has-img>:not(.th){grid-column:1}}
.it a.t{color:var(--ink);font-weight:600;font-size:17px;line-height:1.5;text-decoration:none}
.it a.t:hover{text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:4px}
.it p{margin:6px 0 0;color:var(--sub);font-size:15px}
.it>p:first-child{margin-top:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--dim)}
.tag{color:var(--acc);font-weight:600}
.more{color:var(--sub)}
.ja{display:block}
.ja+.en{display:block;margin-top:4px;font-size:13px;color:var(--dim);font-weight:400}
.state{min-height:50vh;display:grid;place-content:center;text-align:center;gap:12px;color:var(--dim);font-size:14px}
.state code{color:var(--sub);overflow-wrap:anywhere;white-space:pre-line;font-size:12px}
.page.fb{display:flex;flex-direction:column;gap:10px;overflow:hidden;padding-top:6px;padding-bottom:12px}
.fbcard{margin:auto 0;align-self:center;display:flex;align-items:center;gap:4px;color:var(--dim);font-size:14px;max-width:100%}
.fbcard span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:6px}
.fbcard small{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.fbbar{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--dim)}
.fbbar span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb .btn.sm{height:34px;min-width:34px;width:34px;padding:0;text-decoration:none}
.fb .btn.sm svg{width:16px;height:16px}
.fb iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
:root[data-theme=dark] .fb iframe{filter:invert(.92) hue-rotate(180deg)}
footer{display:flex;align-items:center;justify-content:center;gap:10px;padding-block:10px 14px;border-top:1px solid var(--line)}
.btn.play{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg)}
.btn.play:hover{background:var(--ink);color:var(--bg);opacity:.85}
.btn.play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.btn.play .pa,.btn.play[aria-pressed=true] .pl{display:none}.btn.play[aria-pressed=true] .pa{display:block}
.btn.play[aria-pressed=true]{background:var(--acc);color:#fff}
details{position:relative}
summary{list-style:none}summary::-webkit-details-marker{display:none}
.set{position:absolute;right:0;top:46px;z-index:5;width:min(320px,88vw);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13px;color:var(--sub);box-shadow:0 12px 32px rgba(0,0,0,.12)}
.set label{display:block;margin:14px 0 6px;color:var(--ink);font-weight:600}
.set textarea{width:100%;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px/1.5 system-ui;resize:vertical}
.set p{margin:12px 0 0;color:var(--dim)}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1;height:38px;font-size:16px;text-align:center;background:none;border:1px solid var(--line);border-radius:8px}
.row .btn{border:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;height:34px;border:0;background:none;color:var(--sub);cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{color:var(--ink);font-weight:600;background:var(--hover)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){h1 #num{font-size:30px}.page h2{font-size:21px}.wrap,.page{padding-inline:16px}.tabs{padding-inline:16px}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
 /* ---- 表示領域を広く ---- */
.app{grid-template-rows:auto auto 1fr auto}
.app>header{grid-row:1}.prog{grid-row:2}.deck{grid-row:3}.app>footer{grid-row:4}.tabs{display:none}
header{align-items:center;gap:2px;padding-block:8px 2px}
h1{font-size:14px;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:2px}
h1 #num{display:inline;margin:0;font-size:14px;font-weight:600;color:var(--dim);letter-spacing:0}
h1 small{display:inline;margin:0 0 0 6px;font-size:12px;color:var(--dim);font-weight:400}
.lp{flex:none}
.lsel{gap:2px;grid-auto-flow:column;padding:0 6px 0 10px;font-weight:700;color:var(--ink)}
.lsel::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px}
.lsel svg{width:16px;height:16px}
.lmenu{position:absolute;left:0;top:44px;z-index:6;display:grid;min-width:180px;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14)}
.lmenu .lang{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:8px;text-align:left}
.lmenu .lang:hover{background:var(--hover)}
.lmenu .lang i{width:22px;font-weight:700;color:var(--ink)}
.lmenu .lang span{display:inline;font-weight:500}
.lmenu .lang::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lc);margin:0;flex:none}
.lmenu .lang[aria-pressed=true]{background:var(--hover);color:var(--ink)}
.lmenu .lang[aria-pressed=true]::before{margin:0}
.prog{padding-block:4px 2px}
.page{padding-top:10px;padding-bottom:16px}
.page h2{font-size:18px;margin:0 0 2px}
.it{padding:14px 0}
footer{gap:6px;padding-block:4px 6px}
footer .btn{height:40px}
.btn.play{width:42px;height:42px}
#toast{bottom:calc(60px + env(safe-area-inset-bottom))}
.set{top:46px}
@media(max-width:600px){.page h2{font-size:17px}h1 small{display:none}}
 /* ---- 記事を画面いっぱいに ---- */

.app{grid-template-rows:auto 1fr auto}
.prog{grid-row:1;padding:6px 16px 0;padding-top:calc(6px + env(safe-area-inset-top))}
.deck{grid-row:2}.bar{grid-row:3}
.app{padding-top:0}
#pos{display:none}
#date{font-size:13px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
#date::before{content:"·";margin:0 4px}
#date:empty{display:none}
.page{padding-top:12px;padding-bottom:12px}
.bar{display:flex;align-items:center;gap:2px;padding-block:4px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.bar .sp{flex:1}
.bar .btn{height:40px;min-width:36px}.bar .btn.ic{width:36px}
.bar .btn.play{width:42px;height:42px;margin:0 2px}
.lsel{padding:0 4px 0 8px}
.lsel #num{font-weight:600;color:var(--dim);margin-left:5px;font-size:13px}
.lmenu{top:auto;bottom:48px}
.set{top:auto;bottom:50px;right:0}
.set h1{display:block;margin:0 0 10px;font-size:15px;color:var(--ink);white-space:normal}
.set h1 small{display:block;margin:2px 0 0;font-size:12px;color:var(--dim)}
.btn.thm{display:flex;gap:8px;width:100%;justify-content:flex-start;padding:0 10px;border:1px solid var(--line);color:var(--sub)}
#toast{bottom:calc(64px + env(safe-area-inset-bottom))}
@media(max-width:440px){.bar{gap:0;padding-inline:6px}.bar .btn.ic{width:29px;min-width:29px}.bar .btn.play{width:40px;height:40px}.lsel{padding:0 2px 0 6px}.lsel svg{width:14px}}
@media(max-width:400px){.lsel #num{display:none}#date::before{content:none}#date{margin-left:5px}}
@media(max-width:370px){.bar .btn.ic{width:28px;min-width:28px}.bar .btn.play{width:38px;height:38px}.lsel #num{display:none}#date::before{content:none}#date{margin-left:5px}}
.driver-popover.wr-tour{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;font-family:inherit;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.driver-popover.wr-tour .driver-popover-title{font-family:inherit;font-size:15px;font-weight:600}
.driver-popover.wr-tour .driver-popover-description{font-family:inherit;font-size:14px;line-height:1.6;color:var(--sub)}
.driver-popover.wr-tour .driver-popover-progress-text{color:var(--dim)}
.driver-popover.wr-tour .driver-popover-footer button{font-family:inherit;text-shadow:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
.driver-popover.wr-tour .driver-popover-footer .driver-popover-next-btn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.driver-popover.wr-tour .driver-popover-close-btn{color:var(--dim)}
.driver-popover.wr-tour .driver-popover-arrow-side-top{border-top-color:var(--bg)}
.driver-popover.wr-tour .driver-popover-arrow-side-bottom{border-bottom-color:var(--bg)}
.driver-popover.wr-tour .driver-popover-arrow-side-left{border-left-color:var(--bg)}
.driver-popover.wr-tour .driver-popover-arrow-side-right{border-right-color:var(--bg)}
 /* ---- ヘッダーに言語・翻訳・設定、フッターは送りだけ ---- */
.app{grid-template-rows:auto auto 1fr auto}
.hd{grid-row:1}.prog{grid-row:2}.deck{grid-row:3}.bar{grid-row:4}
.hd{display:flex;align-items:center;gap:2px;padding-top:calc(2px + env(safe-area-inset-top));padding-bottom:0}
.hd .sp,.bar .sp{flex:1}
.logo{font-family:"Instrument Serif",Georgia,serif;font-size:23px;line-height:1;letter-spacing:-.015em;color:var(--ink);white-space:nowrap;padding-top:2px}
.hd .btn.ic{width:36px;min-width:36px;height:38px}
.hd .lsel{height:38px}
.prog{padding-top:2px}
.lmenu{top:40px;bottom:auto;left:auto;right:0}
.set{top:42px;bottom:auto}
.bar .btn.ic{width:42px;min-width:42px;height:38px}
.bar .btn.play{width:40px;height:40px;margin:0 6px}
.bar #help{position:absolute;right:max(10px,env(safe-area-inset-right))}
.bar{position:relative;gap:6px;padding-block:3px calc(3px + env(safe-area-inset-bottom))}
@media(max-width:440px){.bar{gap:4px}.bar .btn.ic{width:40px;min-width:40px}}
@media(max-width:400px){.lsel #num{display:inline}#date::before{content:"·"}#date{margin-left:0}}
@media(max-width:370px){.logo{font-size:20px}.lsel #num{display:none}#date::before{content:none}#date{margin-left:5px}.bar .btn.ic{width:38px;min-width:38px}.bar .btn.play{margin:0 4px}}
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" id="tabs" aria-label="セクション"></nav>
  <header class="hd wrap">
    <span class="logo" aria-label="Weekly Reader">Weekly Reader</span>
    <span class="sp"></span>
    <details class="lp"><summary class="btn lsel" aria-label="言語を選ぶ"><span id="lmono">JS</span><span id="num">#—</span><time id="date"></time><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></summary><div class="lmenu" id="langs" role="group" aria-label="言語"></div></details>
    <button class="btn ic" id="tr" aria-pressed="false" aria-label="日本語に翻訳" title="翻訳 (T)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg></button>
    <details class="sd">
      <summary class="btn ic" id="setbtn" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></summary>
      <div class="set">
        <h1><span id="lname">JavaScript Weekly</span></h1>
        <button class="btn thm" id="theme" aria-label="ライト/ダーク切替"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="th-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/><g class="th-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg><span>ライト / ダーク</span></button>
        <label for="jump">号へ移動</label>
        <div class="row"><input id="jump" inputmode="numeric" placeholder="号数で移動"><button class="btn" id="latest">最新</button></div>
        <label>自動再生の速さ</label>
        <div class="seg" id="spd"><button data-v="0">ゆっくり</button><button data-v="1">ふつう</button><button data-v="2">はやい</button></div>
        <label>翻訳</label>
        <div id="trInfo">翻訳エンジン: 確認中</div>
        <label for="px">CORSプロキシ（{url} に記事URL。改行で複数、上から順に試行）</label>
        <textarea id="px" rows="4"></textarea>
        <p style="font-size:12px">バージョン 2026-11-25.14</p>
        <p>？ボタンで使い方ツアー。キー操作：Space 再生／← → セクション／[ ] 号／T 翻訳。カードを押している間は一時停止。</p>
      </div>
    </details>
  </header>
  <div class="prog wrap"><div class="bars" id="bars"></div><span id="pos">–</span></div>
  <main class="deck" id="deck"><div class="page"><div class="state">読み込み中…</div></div></main>
  <nav class="bar wrap" aria-label="操作">
    <span class="sp"></span>
    <button class="btn ic" id="prev" aria-label="前の号" title="前の号 ["><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l-7 7 7 7M19 5l-7 7 7 7"/></svg></button>
    <button class="btn ic" id="back" aria-label="前のセクション" title="前のセクション ←"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="btn ic play" id="play" aria-pressed="false" aria-label="自動再生" title="自動再生 (Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pl" d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/><g class="pa"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></g></svg></button>
    <button class="btn ic" id="fwd" aria-label="次のセクション" title="次のセクション →"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="btn ic" id="next" aria-label="次の号" title="次の号 ]"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l7 7-7 7M12 5l7 7-7 7"/></svg></button>
    <span class="sp"></span>
    <button class="btn ic" id="help" aria-label="使い方" title="使い方"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></button>
  </nav>
</div>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const LANGS = {
  js: {label:'JavaScript', mono:'JS', name:'JavaScript Weekly', kind:'cooper',   base:'https://javascriptweekly.com', fb:812},
  go: {label:'Go',         mono:'Go', name:'Go Weekly',         kind:'cooper',   base:'https://golangweekly.com',     fb:625},
  py: {label:'Python',     mono:'Py', name:"PyCoder's Weekly",  kind:'pycoders', base:'https://pycoders.com',         fb:764},
  rs: {label:'Rust',       mono:'Rs', name:'This Week in Rust', kind:'twir',     base:'https://this-week-in-rust.org', fb:678},
  rb: {label:'Ruby',       mono:'Rb', name:'Ruby Weekly',       kind:'cooper',   base:'https://rubyweekly.com',       fb:780}
};
const DEF_PROXIES = ['https://corsproxy.io/?url={url}','https://api.allorigins.win/raw?url={url}','https://api.codetabs.com/v1/proxy?quest={url}'];
const MONTHS = 'January|February|March|April|May|June|July|August|September|October|November|December';
let proxies = store.get('jsw-proxies', DEF_PROXIES);
// Cloudflare Worker などで配信しているときは、同じ場所の /proxy を最優先で使う
const OWN = /^https?:$/.test(location.protocol) ? location.origin + '/proxy?url={url}' : '';
const fromHash = () => { const m = location.hash.match(/^#(js|go|py|rs|rb)(?:-(\d+))?$/); return m ? {lang:m[1], n:m[2] ? +m[2] : 0} : null; };
let lang = fromHash()?.lang || store.get('jsw-lang', 'js');
if (!LANGS[lang]) lang = 'js';
let issue = 0, data = null, cur = 0, translating = store.get('jsw-tr', false), translator = null, engine = null;
const trCache = store.get('jsw-trcache', {});

/* ---------- 取得 ---------- */
let lastFinal = '';
// プロキシを並列に試し、最初に成功したものを使う（各15秒でタイムアウト）
async function fetchHTML(url){
  const ctrls = [];
  const one = async p => {
    const c = new AbortController(); ctrls.push(c);
    const to = setTimeout(() => c.abort(), 15000);
    try{
      const r = await fetch(p.replace('{url}', encodeURIComponent(url)), {signal: c.signal});
      // 自前Worker以外のサイトに置いた場合、/proxy 自体が無くて404になるのは「号が無い」扱いにしない
      if (r.status === 404 && (p !== OWN || r.headers.get('x-weekly-proxy'))) throw Object.assign(new Error('404'), {nf:true});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const t = await r.text();
      if (t.length < 500) throw new Error('空のレスポンス');
      return {t, final: r.headers.get('x-final-url') || ''};
    }catch(e){
      throw e.name === 'AbortError' ? new Error('タイムアウト') : e.nf ? e : new Error(e.message === 'Failed to fetch' ? '接続できません' : e.message);
    }finally{ clearTimeout(to); }
  };
  const list = (OWN ? [OWN] : []).concat(proxies);
  if (!list.length) throw new Error('プロキシ未設定');
  try{
    const res = await Promise.any(list.map(one));
    ctrls.forEach(c => c.abort());
    lastFinal = res.final;
    return res.t;
  }catch(agg){
    const errs = agg.errors || [agg];
    const nf = errs.find(e => e.nf);
    if (nf) throw nf;
    throw new Error(errs.map((e, i) => { let h = ''; try{ h = new URL(list[i].replace('{url}', ''), location.href).host; }catch(_){ h = 'proxy' + (i + 1); } return h + ': ' + e.message; }).join('\n'));
  }
}
// This Week in Rust は URL に日付が入るので、号数→URL の対応表を作る
async function twirIndex(force){
  let c = store.get('jsw-rs-index', {t:0, map:{}});
  const age = Date.now() - c.t, has = Object.keys(c.map).length;
  if (has && !force && age < 6 * 3600e3) return c;
  if (has && force && age < 10 * 60e3) return c;
  const scan = t => { const m = {}; for (const x of t.matchAll(/\/blog\/(\d{4})\/(\d{2})\/(\d{2})\/this-week-in-rust-(\d+)\//g)) m[x[4]] = x[0]; return m; };
  let found = {};
  try{ found = scan(await fetchHTML(LANGS.rs.base + '/blog/archives/index.html')); }catch(e){}
  if (!Object.keys(found).length){ try{ found = scan(await fetchHTML(LANGS.rs.base + '/atom.xml')); }catch(e){} }
  if (!Object.keys(found).length && !has) throw new Error('号の一覧を取得できませんでした');
  c = {t:Date.now(), map:{...c.map, ...found}};
  store.set('jsw-rs-index', c);
  return c;
}
async function issueUrl(n){
  const L = LANGS[lang];
  if (L.kind !== 'twir') return {url: L.base + (n ? '/issues/' + n : '/latest'), n};
  let idx = await twirIndex(false);
  if (!n) n = Math.max(...Object.keys(idx.map).map(Number));
  if (!idx.map[n]) idx = await twirIndex(true);
  const path = idx.map[n];
  if (!path) throw Object.assign(new Error('404'), {nf:true});
  const d = path.match(/(\d{4})\/(\d{2})\/(\d{2})/);
  return {url: L.base + path, n, date: d ? d[1] + '-' + d[2] + '-' + d[3] : ''};
}

/* ---------- 解析 ---------- */
const junk = /unsubscribe|view (this|it) online|view in browser|manage your|preferences|cooperpress|forward this|read on the web|read the web version|prefer to not|email address|happy pythoning|copyright ©|want twir in your inbox|hello and welcome to another|openly developed on github|if you find any errors|subscribe here|let us know if you would like/i;
const clean = s => s.replace(/\s+/g, ' ').trim();
const headName = t => { t = clean(t).replace(/:$/, ''); return t === t.toUpperCase() ? t.charAt(0) + t.slice(1).toLowerCase() : t; };
function linesOf(el){
  const c = el.cloneNode(true);
  c.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
  c.querySelectorAll('p,div,td,tr,li,h1,h2,h3,h4,table').forEach(x => x.append('\n'));
  return c.textContent.split('\n').map(clean).filter(Boolean);
}
function parse(html, kind){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  { // 号数などに混ざるゼロ幅文字（&#8203; など）を除去
    const tw = doc.createTreeWalker(doc.documentElement, NodeFilter.SHOW_TEXT);
    for (let t; t = tw.nextNode();) if (/[\u200B-\u200D\u2060\uFEFF]/.test(t.nodeValue)) t.nodeValue = t.nodeValue.replace(/[\u200B-\u200D\u2060\uFEFF]/g, '');
  }
  const root = kind === 'cooper' ? (doc.querySelector('.issue-html, #content, .issue, main') || doc.body)
             : kind === 'twir' ? (doc.querySelector('.post-content, article, main') || doc.body) : doc.body;
  const text = root.textContent;
  const dm = text.match(new RegExp('(' + MONTHS + ')\\s+\\d{1,2},\\s+\\d{4}', 'i'));
  const date = dm ? dm[0].toLowerCase().replace(/^\w/, c => c.toUpperCase()) : '';
  const nm = kind === 'twir' ? (doc.title + ' ' + text).match(/This Week in Rust (\d{2,4})/i)
           : (text.match(new RegExp('#\\s*(\\d{2,4})\\s*[—–-]\\s*(' + MONTHS + ')', 'i')) || text.match(/Issue\s+\d+\s*#\s*(\d{2,4})/i));
  const sections = [{name:'トップ', items:[]}];
  const taken = new Set();
  const inTaken = el => { for (let p = el.parentElement; p; p = p.parentElement) if (taken.has(p)) return true; return false; };
  const push = it => { if (it && !junk.test(it.title + ' ' + it.desc)) sections[sections.length - 1].items.push(it); };
  const head = name => { if (name && !junk.test(name)) sections.push({name, items:[]}); };
  const walk = fn => { const w = doc.createTreeWalker(root, NodeFilter.SHOW_ELEMENT); for (let el = w.currentNode; el; el = w.nextNode()){ if (!inTaken(el)) fn(el); } };

  if (kind === 'cooper'){
    walk(el => {
      const c = (el.className || '') + '', t = el.textContent.trim();
      if (t && t.length <= 60 && !el.querySelector('a[href]') && (/heading|el-splitbar/i.test(c) || /^(H[2-4]|TH)$/.test(el.tagName) || (/^(P|TD|STRONG|B)$/.test(el.tagName) && /^[A-Z][A-Z &/]+:$/.test(t)))){ head(headName(t.replace(/^[^\p{L}\p{N}]+/u, ''))); taken.add(el); return; }
      if (/(^|\s)(el-item|item|el-fullitem)(\s|$)/.test(c) && el.querySelector('a[href]')){ taken.add(el); push(cooperItem(el)); return; }
      if (el.tagName === 'LI' && el.querySelector('a[href]')){ taken.add(el); push(cooperItem(el)); }
    });
  } else if (kind === 'pycoders'){
    const isLink = a => /\/link\//.test(a.getAttribute('href') || '');
    const hrefs = el => new Set([...el.querySelectorAll('a[href]')].filter(isLink).map(a => a.getAttribute('href'))).size;
    const blocks = new Set();
    for (const a of root.querySelectorAll('a[href]')){
      if (!isLink(a) || a.textContent.trim().length < 3) continue;
      let b = a;
      while (b.parentElement && b.parentElement !== root && hrefs(b.parentElement) <= 1 && !b.parentElement.querySelector('h1,h2,h3,h4') && b.parentElement.textContent.length < 1500) b = b.parentElement;
      blocks.add(b);
    }
    walk(el => {
      if (/^H[1-4]$/.test(el.tagName)){ const t = el.textContent.trim(); if (t && t.length < 70 && !/^#\d/.test(t) && !hrefs(el)){ head(headName(t.replace(/^[^\p{L}\p{N}]+/u, ''))); taken.add(el); } return; }
      if (blocks.has(el)){ taken.add(el); push(pyItem(el)); }
    });
  } else {
    const ok = x => !(x.getAttribute('href') || '').startsWith('#') && x.textContent.trim();
    let base = '';
    walk(el => {
      const m = el.tagName.match(/^H([2-6])$/);
      if (m){
        const t = clean(el.textContent);
        if (t && t.length < 80){ if (+m[1] <= 3){ base = headName(t); head(base); } else head(base ? base + ' · ' + headName(t) : headName(t)); taken.add(el); }
        return;
      }
      // リスト直前の短いラベル（「Rust」「Cargo」など）は小見出しとして分ける
      if (/^(P|STRONG|B|DT)$/.test(el.tagName) && !el.querySelector('a[href]')){
        const t = clean(el.textContent), nx = el.nextElementSibling || el.parentElement?.nextElementSibling;
        if (t && t.length < 50 && nx && /^(UL|OL|DL)$/.test(nx.tagName)){ head(base ? base + ' · ' + t.replace(/:$/, '') : t.replace(/:$/, '')); taken.add(el); return; }
      }
      if (el.tagName === 'LI'){
        // 入れ子のリストは子の項目も1件ずつ切り出す
        const nested = [...el.children].some(c => /^(UL|OL)$/.test(c.tagName) && c.querySelector('a[href]'));
        const own = el.cloneNode(true); own.querySelectorAll('ul,ol').forEach(x => x.remove());
        const a = [...own.querySelectorAll('a[href]')].find(ok);
        if (!nested) taken.add(el);
        if (!a){
          const label = clean(own.textContent).replace(/:$/, '');
          if (nested && label && label.length < 60) head(base ? base + ' · ' + label : label);
          return;
        }
        const title = clean(a.textContent);
        push({title, href: a.getAttribute('href'), desc: clean(own.textContent).replace(title, '').replace(/^[\s|:–—\-]+|[\s|:–—\-]+$/g, ''), author:'', sp:false, img: pickImg(own)});
        return;
      }
      if (el.tagName === 'P' && el.textContent.trim().length > 40){
        taken.add(el);
        const a = [...el.querySelectorAll('a[href]')].find(ok);
        push({title:'', href: a ? a.getAttribute('href') : '', desc: clean(el.textContent), author:'', sp:false, img: pickImg(el)});
      }
    });
  }
  return {date, num: nm ? +nm[1] : 0, sections: sections.filter(s => s.items.length)};
}
// 記事ブロック内の画像（ロゴや計測用の小さな画像は除外）
let BASE = '';
function pickImg(el){
  for (const im of el.querySelectorAll('img')){
    const src = im.getAttribute('src') || im.getAttribute('data-src') || '';
    if (!src || src.startsWith('data:')) continue;
    const w = +im.getAttribute('width') || 0, h = +im.getAttribute('height') || 0;
    if ((w && w < 80) || (h && h < 50)) continue;
    if (/pixel|track|open\.gif|spacer|logo|icon|avatar|badge|emoji/i.test(src + ' ' + (im.getAttribute('alt') || '') + ' ' + (im.className || ''))) continue;
    try{ const u = new URL(src, BASE); if (/^https?:$/.test(u.protocol)) return u.href; }catch(e){}
  }
  return '';
}
function cooperItem(el){
  const a = el.querySelector('.mainlink a, a[href*="/link/"]') || [...el.querySelectorAll('a[href]')].find(x => x.textContent.trim().length > 2);
  if (!a) return null;
  const title = clean(a.textContent);
  const nameEl = el.querySelector('.name, .author');
  let author = nameEl ? clean(nameEl.textContent) : '';
  const lines = linesOf(el.querySelector('.desc') || el).filter(l => !/^sponsor$/i.test(l));
  if (!author && lines.length > 1){ const last = lines[lines.length - 1]; if (last.length < 70 && !/[.!?:]$/.test(last) && !last.includes(title)) author = lines.pop().replace(/\s*sponsor\s*$/i, ''); }
  let desc = lines.join(' ');
  desc = desc.replace(title, '').replace(author, '').replace(/^[\s—–\-:|]+/, '').replace(/\bsponsor\b\s*$/i, '').trim();
  const sp = /sponsor/i.test(el.innerHTML.match(/class="[^"]*"/g)?.join(' ') || '') || /\bsponsor\b/i.test(el.textContent.slice(-40));
  return {title, href: a.getAttribute('href'), desc, author, sp, img: pickImg(el)};
}
function pyItem(el){
  const a = [...el.querySelectorAll('a[href*="/link/"]')].find(x => x.textContent.trim().length > 2);
  if (!a) return null;
  const title = clean(a.textContent);
  let sp = false, src = '';
  const desc = [];
  for (let L of linesOf(el)){
    if (/sponsor\s*$/i.test(L)){ sp = true; L = L.replace(/\s*sponsor\s*$/i, '').trim(); if (!L) continue; }
    if (L.includes(title)){ L = L.replace(title, '').trim(); if (!L) continue; }
    const [base, ...rest] = L.split('•').map(s => s.trim());
    if (!src && /[A-Z]/.test(base) && !/[a-z]/.test(base) && base.length < 60){
      src = (base.includes('.') ? base.toLowerCase() : base.toLowerCase().replace(/\b\w/g, c => c.toUpperCase())) + (rest.length ? ' · ' + rest.join(' · ') : '');
      continue;
    }
    desc.push(L);
  }
  return {title, href: a.getAttribute('href'), desc: desc.join(' '), author: src, sp, img: pickImg(el)};
}

/* ---------- 翻訳 ---------- */
async function initEngine(){
  try{
    if ('Translator' in self){
      const av = await Translator.availability({sourceLanguage:'en', targetLanguage:'ja'});
      if (av !== 'unavailable'){ engine = 'chrome'; $('#trInfo').textContent = '翻訳エンジン: Chrome内蔵 Translator（端末内・無料・APIキー不要）'; return; }
    }
  }catch(e){}
  engine = 'google';
  $('#trInfo').textContent = '翻訳エンジン: Google翻訳（非公式エンドポイント、送信先は Google）';
}
async function tr(text){
  if (!text) return '';
  if (trCache[text]) return trCache[text];
  let out = '';
  if (engine === 'chrome'){
    translator = translator || await Translator.create({sourceLanguage:'en', targetLanguage:'ja'});
    out = await translator.translate(text);
  } else {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q=' + encodeURIComponent(text));
    const j = await r.json();
    out = j[0].map(s => s[0]).join('');
  }
  trCache[text] = out;
  return out;
}
let saveT;
async function translatePage(i){
  if (!translating || !data || !data.pages[i]) return;
  const page = $('#deck').children[i];
  const q = [...page.querySelectorAll('[data-src]:not([data-done])')];
  const run = async () => { for (let el; el = q.shift();){
    el.dataset.done = '1';
    try{
      const ja = await tr(el.dataset.src);
      if (!translating){ delete el.dataset.done; continue; }
      el.innerHTML = '<span class="ja">' + esc(ja) + '</span><span class="en">' + esc(el.dataset.src) + '</span>';
    }catch(e){ delete el.dataset.done; $('#trInfo').textContent = '翻訳に失敗: ' + e.message; }
  }};
  await Promise.all([run(), run(), run(), run()]);
  clearTimeout(saveT);
  saveT = setTimeout(() => { const ks = Object.keys(trCache); if (ks.length > 3000) ks.slice(0, ks.length - 3000).forEach(k => delete trCache[k]); store.set('jsw-trcache', trCache); }, 800);
}
function untranslate(){
  document.querySelectorAll('[data-src][data-done]').forEach(el => { el.textContent = el.dataset.src; delete el.dataset.done; });
}

/* ---------- 描画 ---------- */
function card(it){
  const link = it.title ? '<a class="t" href="' + esc(it.href) + '" target="_blank" rel="noopener" data-src="' + esc(it.title) + '">' + esc(it.title) + '</a>' : '';
  const desc = it.desc ? '<p data-src="' + esc(it.desc) + '">' + esc(it.desc) + '</p>' : '';
  const more = !it.title && it.href ? '<a class="more" href="' + esc(it.href) + '" target="_blank" rel="noopener">リンク ↗</a>' : '';
  const meta = (it.sp || it.author || more) ? '<div class="meta">' + (it.sp ? '<span class="tag">Sponsor</span>' : '') + (it.author ? '<span>' + esc(it.author) + '</span>' : '') + more + '</div>' : '';
  const img = it.img ? '<img class="th" src="' + esc(it.img) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">' : '';
  return '<article class="it' + (it.img ? ' has-img' : '') + '">' + img + link + desc + meta + '</article>';
}
// 日付は 2026.11.21 の形にそろえる
function fmtDate(d){
  if (!d) return '';
  const t = new Date(/^\d{4}-\d{2}-\d{2}$/.test(d) ? d + 'T00:00:00' : d);
  if (isNaN(t)) return d;
  return t.getFullYear() + '.' + String(t.getMonth() + 1).padStart(2, '0') + '.' + String(t.getDate()).padStart(2, '0');
}
// 画面に収まるだけ記事を詰めてページを作る（収まらない1件は単独ページ）
function render(keep){
  const s = data.sections, deck = $('#deck'), pages = [], first = [], tpl = document.createElement('template');
  const fd = fmtDate(data.date);
  $('#date').textContent = fd ? fd.slice(5) : ''; $('#date').title = fd;
  $('#tabs').innerHTML = s.map((x, i) => '<button class="tab" data-i="' + i + '">' + esc(x.name) + '</button>').join('');
  deck.innerHTML = '';
  s.forEach((x, si) => {
    first[si] = pages.length;
    let pg, box, items;
    const open = () => {
      pg = document.createElement('section'); pg.className = 'page';
      pg.innerHTML = '<div><h2>' + esc(x.name) + '<small></small><span>' + x.items.length + '</span></h2></div>';
      deck.append(pg); box = pg.firstChild; items = [];
      pages.push({si, name:x.name, total:x.items.length, items, el:pg});
    };
    open();
    for (const it of x.items){
      tpl.innerHTML = card(it);
      const art = tpl.content.firstElementChild;
      box.append(art);
      if (items.length && pg.scrollHeight > pg.clientHeight + 1){ art.remove(); open(); box.append(art); }
      items.push(it);
    }
  });
  pages.forEach((p, i) => {
    p.el.dataset.i = i;
    const same = pages.filter(q => q.si === p.si);
    if (same.length > 1) p.el.querySelector('h2 small').textContent = (same.indexOf(p) + 1) + '/' + same.length;
  });
  data.pages = pages.map(({el, ...rest}) => rest); data.first = first;
  $('#bars').innerHTML = pages.map((x, i) => '<b data-i="' + i + '" title="' + esc(x.name) + '"><i></i></b>').join('');
  $('#bars').classList.toggle('many', pages.length > 40);
  const start = keep ? Math.max(0, data.pages.findIndex(p => p.items.includes(keep))) : 0;
  deck.scrollLeft = start * deck.clientWidth;
  cur = start; mark(); resetTimer();
  translatePage(cur); translatePage(cur + 1);
}
const keepItem = () => data && data.pages && data.pages[cur] ? data.pages[cur].items[0] : null;
function stateMsg(html){
  $('#tabs').innerHTML = '';
  $('#deck').innerHTML = '<div class="page"><div class="state">' + html + '</div></div>';
  $('#pos').textContent = '–';
  $('#bars').innerHTML = '';
}
function mark(){
  const n = data ? data.pages.length : 0;
  $('#pos').textContent = n ? (cur + 1) + ' / ' + n : '–';
  const si = n ? data.pages[cur].si : -1;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('on', i === si));
  const t = $('#tabs').children[si];
  if (t) t.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
}
function go(i){
  if (!data) return;
  i = Math.max(0, Math.min(data.pages.length - 1, i));
  const d = $('#deck');
  d.scrollTo({left: i * d.clientWidth, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}
function setHead(){
  const h = '#' + lang + '-' + issue;
  if (issue && location.hash !== h) history.replaceState(null, '', h);
  $('#num').textContent = issue ? '#' + issue : '#—';
}

/* ---------- 号の読み込み ---------- */
let loadId = 0;
async function load(n){
  const id = ++loadId, L = LANGS[lang];
  const prev = data && issue ? {issue, data, cur, lang} : null; // 新しい号が無かったときに戻すため
  data = null;
  $('#jump').value = '';
  $('#date').textContent = '';
  const cached = n ? store.get('jsw-' + lang + '-' + n, null) : null;
  if (n){ issue = n; setHead(); }
  stateMsg((n ? '#' + n : '最新号') + ' を読み込み中…');
  try{
    let parsed = cached;
    if (!parsed){
      const u = await issueUrl(n);
      BASE = u.url;
      lastFinal = '';
      parsed = parse(await fetchHTML(u.url), L.kind);
      // 存在しない号は一覧などへ転送されることがある（JavaScript Weekly など）
      if (n && L.kind !== 'twir' && lastFinal && !lastFinal.includes('/issues/' + n)) throw Object.assign(new Error('404'), {nf:true});
      if (u.date && !parsed.date) parsed.date = u.date;
      n = u.n || n;
      if (!n){
        const fm = lastFinal.match(/\/issues\/(\d+)/);
        n = parsed.num || (fm ? +fm[1] : 0);
        if (!n) throw new Error('最新号の番号を読み取れませんでした');
      }
      if (id !== loadId) return;
      if (!parsed.sections.length) throw new Error('記事を見つけられませんでした（ページ構造が変わった可能性）');
      store.set('jsw-' + lang + '-' + n, parsed);
    }
    if (id !== loadId) return;
    issue = n; setHead();
    store.set('jsw-last-' + lang, n);
    if (n > store.get('jsw-latest-' + lang, 0)) store.set('jsw-latest-' + lang, n);
    data = parsed; render();
  }catch(e){
    if (id !== loadId) return;
    setPlaying(false);
    // 今の号より新しい号が取れなかった → 最新号として今の号に留まる
    const latest = store.get('jsw-latest-' + lang, 0);
    if (prev && prev.lang === lang && n > prev.issue && (e.nf || !latest || n > latest)){
      issue = prev.issue; data = prev.data; setHead(); render(); go(prev.cur);
      if (issue > latest) store.set('jsw-latest-' + lang, issue);
      toast('#' + issue + ' が最新号です');
      return;
    }
    if (!n){ issue = store.get('jsw-last-' + lang, 0); setHead(); }
    $('#date').textContent = '';
    if (e.nf) stateMsg('#' + n + ' はまだ公開されていません（最新号まで読み終わりました）。');
    else showFallback(n, e.message);
  }
}
function setLang(l, n){
  lang = l; store.set('jsw-lang', l);
  document.documentElement.dataset.lang = l;
  $('#lname').textContent = LANGS[l].name;
  $('#lmono').textContent = LANGS[l].mono;
  const lp = $('.lp'); if (lp) lp.open = false;
  document.title = LANGS[l].name + ' Reader';
  document.querySelectorAll('.lang').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l));
  issue = 0;
  load(n || store.get('jsw-last-' + l, 0));
}

/* ---------- フォールバック：元のページをそのまま表示 ---------- */
let fbUrl = '';
function originalUrl(n){
  const L = LANGS[lang];
  if (L.kind !== 'twir') return L.base + (n ? '/issues/' + n : '/latest');
  const path = store.get('jsw-rs-index', {map:{}}).map[n];
  return L.base + (path || (n ? '/blog/archives/index.html' : '/'));
}
function viaGoogle(u){
  const x = new URL(u);
  return 'https://' + x.host.replace(/-/g, '--').replace(/\./g, '-') + '.translate.goog' + x.pathname + '?_x_tr_sl=en&_x_tr_tl=ja&_x_tr_hl=ja';
}
const fbSrc = () => translating ? viaGoogle(fbUrl) : fbUrl;
let fbMsg = '';
const BTN_OPEN = '<a class="btn sm" id="fbopen" target="_blank" rel="noopener" aria-label="新しいタブで開く" title="新しいタブで開く（翻訳オンなら日本語）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>';
const BTN_RETRY = '<button class="btn sm" id="retry" aria-label="再試行" title="再試行"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>';
function showFallback(n, msg){
  fbUrl = originalUrl(n); fbMsg = msg;
  $('#tabs').innerHTML = ''; $('#bars').innerHTML = ''; $('#pos').textContent = '–';
  const embed = store.get('jsw-embed-' + lang, false);
  $('#deck').innerHTML = '<div class="page fb">' + (embed
    ? '<div class="fbbar"><span title="' + esc(msg) + '">元のページを表示中</span>' + BTN_OPEN + BTN_RETRY + '<button class="btn sm" id="fbhide" aria-label="埋め込みをやめる" title="埋め込みをやめる">×</button></div><iframe id="fbframe" title="元のページ" referrerpolicy="no-referrer"></iframe>'
    : '<div class="fbcard"><span title="' + esc(msg) + '">取得できませんでした<small>' + esc(msg.split('\n')[0]) + '</small></span>' + BTN_OPEN + '<button class="btn sm" id="fbembed" aria-label="ここに表示" title="ここに表示"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></svg></button>' + BTN_RETRY + '</div>') + '</div>';
  const em = $('#fbembed'); if (em) em.onclick = () => { store.set('jsw-embed-' + lang, true); showFallback(n, fbMsg); };
  const hd = $('#fbhide'); if (hd) hd.onclick = () => { store.set('jsw-embed-' + lang, false); showFallback(n, fbMsg); };
  $('#retry').onclick = () => load(n);
  refreshFallback();
}
function refreshFallback(){
  const o = $('#fbopen'); if (o) o.href = fbSrc();
  const f = $('#fbframe'); if (f) f.src = fbSrc();
}

let toastT;
function toast(msg){
  let t = $('#toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ---------- 使い方ツアー（Driver.js を必要なときだけ読み込む） ---------- */
const DRIVER = 'https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/';
let driverReady;
function loadDriver(){
  if (driverReady) return driverReady;
  driverReady = new Promise((ok, ng) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = DRIVER + 'driver.css'; document.head.append(l);
    const sc = document.createElement('script'); sc.src = DRIVER + 'driver.js.iife.js';
    sc.onload = () => ok(window.driver.js.driver); sc.onerror = () => { driverReady = null; ng(new Error('load')); };
    document.head.append(sc);
  });
  return driverReady;
}
async function startTour(){
  setPlaying(false);
  document.querySelectorAll('details[open]').forEach(d => d.open = false);
  let driver;
  try{ driver = await loadDriver(); }catch(e){ toast('ツアーを読み込めませんでした'); return; }
  const steps = [
    {element:'#deck', popover:{title:'記事', description:'左右にスワイプ（または ← →）でページをめくります。'}},
    {element:'#bars', popover:{title:'進み具合', description:'この号のどこを読んでいるか。線を押すとそのページへ飛びます。'}},
    {element:'.lsel', popover:{title:'言語・号・日付', description:'押すと JS / Go / Py / Rs / Rb を切り替えられます。'}},
    {element:'#prev', popover:{title:'号を移動', description:'« で1つ古い号、» で1つ新しい号へ。'}},
    {element:'#back', popover:{title:'ページを移動', description:'‹ › で前後のページへ。'}},
    {element:'#play', popover:{title:'自動再生', description:'文字量に合わせて自動でめくり、号の最後で次の号へ進みます。記事を押している間は一時停止。'}},
    {element:'#tr', popover:{title:'翻訳', description:'記事を日本語に翻訳します。原文も下に残ります。'}},
    {element:'#setbtn', popover:{title:'設定', description:'号数で移動、最新号、自動再生の速さ、ライト / ダークの切り替えなど。'}}
  ].filter(st => { const el = document.querySelector(st.element); return el && el.offsetParent !== null; });
  driver({showProgress:true, progressText:'{{current}} / {{total}}', nextBtnText:'次へ', prevBtnText:'戻る', doneBtnText:'閉じる', popoverClass:'wr-tour', steps}).drive();
}
$('#help').onclick = startTour;

/* ---------- 自動再生 ---------- */
let playing = false, hold = false, elapsed = 0, dur = 0, lastT = 0, spd = store.get('jsw-spd', 1);
function pageDur(i){
  const p = data.pages[i], len = p.items.reduce((a, it) => a + (it.title || '').length + (it.desc || '').length, 0);
  return Math.min(45, Math.max(5, len / [11, 17, 26][spd])) * 1000;
}
function paint(){
  [...$('#bars').children].forEach((b, i) => { b.firstChild.style.transform = 'scaleX(' + (i < cur ? 1 : i > cur ? 0 : Math.min(1, dur ? elapsed / dur : 0)) + ')'; });
}
function resetTimer(){ elapsed = 0; dur = data && data.pages ? pageDur(cur) : 0; paint(); }
function setPlaying(v){ playing = v; $('#play').setAttribute('aria-pressed', v); lastT = performance.now(); }
function advance(){
  if (cur < data.pages.length - 1){ cur++; mark(); resetTimer(); go(cur); translatePage(cur + 1); }
  else { elapsed = 0; load(issue + 1); }
}
function tick(t){
  requestAnimationFrame(tick);
  const dt = Math.min(t - lastT, 100); lastT = t;
  if (!playing || hold || document.hidden || !data || !data.pages || document.querySelector('details[open]')) return;
  elapsed += dt;
  const b = $('#bars').children[cur]; if (b) b.firstChild.style.transform = 'scaleX(' + Math.min(1, elapsed / dur) + ')';
  if (elapsed >= dur) advance();
}
requestAnimationFrame(t => { lastT = t; tick(t); });
$('#play').onclick = () => setPlaying(!playing);
const deck = $('#deck');
deck.addEventListener('pointerdown', () => { hold = true; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => deck.addEventListener(ev, () => { hold = false; }));
const paintSpd = () => document.querySelectorAll('#spd button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === spd));
$('#spd').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; spd = +b.dataset.v; store.set('jsw-spd', spd); paintSpd(); if (data && data.pages){ const f = dur ? elapsed / dur : 0; dur = pageDur(cur); elapsed = f * dur; } });
paintSpd();

/* ---------- イベント ---------- */
$('#langs').innerHTML = Object.entries(LANGS).map(([k, v]) => '<button class="lang" data-l="' + k + '" style="--lc:var(--c-' + k + ')" aria-label="' + v.label + '"><i>' + v.mono + '</i><span>' + v.label + '</span></button>').join('');
$('#langs').addEventListener('click', e => { const b = e.target.closest('.lang'); if (!b) return; if (b.dataset.l !== lang) setLang(b.dataset.l); else $('.lp').open = false; });
document.addEventListener('click', e => { document.querySelectorAll('details[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; }); });
$('#latest').onclick = () => load(0);
let st;
$('#deck').addEventListener('scroll', e => {
  clearTimeout(st);
  st = setTimeout(() => {
    const d = e.target, i = Math.round(d.scrollLeft / d.clientWidth);
    if (data && i !== cur){ cur = i; mark(); resetTimer(); translatePage(i); translatePage(i + 1); }
  }, 80);
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b && data) go(data.first[+b.dataset.i]); });
$('#bars').addEventListener('click', e => { const b = e.target.closest('b'); if (b) go(+b.dataset.i); });
$('#prev').onclick = () => issue > 1 && load(issue - 1);
$('#back').onclick = () => go(cur - 1);
$('#fwd').onclick = () => go(cur + 1);
$('#next').onclick = () => issue && load(issue + 1);
$('#jump').addEventListener('keydown', e => { if (e.key === 'Enter'){ const v = parseInt(e.target.value); if (v > 0) load(v); } });
$('#tr').onclick = () => {
  translating = !translating; store.set('jsw-tr', translating);
  $('#tr').setAttribute('aria-pressed', translating);
  if (translating){ translatePage(cur); translatePage(cur + 1); } else untranslate();
  refreshFallback();
};
$('#px').value = proxies.join('\n');
$('#px').addEventListener('change', e => {
  proxies = e.target.value.split('\n').map(s => s.trim()).filter(s => s.includes('{url}'));
  if (!proxies.length) proxies = DEF_PROXIES;
  store.set('jsw-proxies', proxies);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); go(cur - 1); }
  else if (e.key === ']' && issue) load(issue + 1);
  else if (e.key === '[' && issue > 1) load(issue - 1);
  else if (e.key === 't' || e.key === 'T') $('#tr').click();
  else if (e.key === ' '){ e.preventDefault(); setPlaying(!playing); }
});
addEventListener('hashchange', () => { const h = fromHash(); if (!h) return; if (h.lang !== lang) setLang(h.lang, h.n); else if (h.n && h.n !== issue) load(h.n); });
let rsT;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (data && data.pages) render(keepItem()); }, 250); });
if (document.fonts) document.fonts.ready.then(() => { if (data && data.pages) render(keepItem()); });

const applyTheme = t => { document.documentElement.dataset.theme = t; };
applyTheme(store.get('jsw-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(t); store.set('jsw-theme', t); };
$('#tr').setAttribute('aria-pressed', translating);
initEngine();
setLang(lang, fromHash()?.n);
}
</script>
</body>
</html>
